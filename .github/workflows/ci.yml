name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # android-actions/setup-android@v3 now fails on the hosted image: it still asks
      # sdkmanager for the legacy "tools" package, which Google removed, and the step
      # dies with "Failed to find package 'tools'". The runner already ships an SDK and
      # accepted licences, so drive its sdkmanager directly instead.
      - name: Install platform and build tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "using $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The orbital kernel, the parsers and the drift model are pure JVM code, so the
      # whole test suite runs here without a device or an emulator.
      # gradle.properties asks for a 6g daemon, which is right for a workstation but too
      # much for the hosted runner: the JVM then thrashes and Gradle aborts with
      # "the JVM garbage collector is thrashing". Cap it here rather than lowering the
      # project value, which would slow local release builds down.
      - name: Unit tests
        run: >-
          ./gradlew :core:domain:test :core:data:test
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Debug build
        run: >-
          ./gradlew :app:assembleDebug
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: look4sat-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # A release build needs the signing key. Without the secrets below the build still
  # succeeds and produces an unsigned APK, which is what a pull request from a fork
  # will do; only the repository owner has the secrets.
  release-dry-run:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install platform and build tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble release (unsigned on a fork)
        run: >-
          ./gradlew :app:assembleRelease
          -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
          -Dorg.gradle.workers.max=2
