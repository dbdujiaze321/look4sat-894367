name: release

# Tag-driven release for this fork.
#
# Deliberately different from the upstream workflow this tree was forked from: it
# builds, signs and attaches the APK and the source archive to a GitHub release.
# It does not publish to Google Play, because the application id
# com.rtbishop.look4sat belongs to the upstream listing, not to this fork.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install platform and build tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "using $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :core:domain:test :core:data:test

      # R8 in full mode with -repackageclasses needs more headroom than the 6g the
      # project sets in gradle.properties: on the hosted runner it died with
      # "java.lang.OutOfMemoryError: Java heap space" inside minifyReleaseWithR8.
      # The standard runner has 16 GB, so give the daemon room and keep the worker
      # count low enough that the Kotlin and R8 workers do not compete.
      - name: Assemble release
        run: >-
          ./gradlew :app:assembleRelease
          -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
          -Dorg.gradle.workers.max=2

      - name: Sign APK
        id: sign
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          OUT="look4sat-${GITHUB_REF_NAME#v}-release.apk"
          if [ -z "${KEY_STORE:-}" ]; then
            echo "::warning::No signing secrets: the build is left unpublished rather than published unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEY_STORE" | base64 -d > keystore.jks
          apksigner sign \
            --ks keystore.jks \
            --ks-pass "pass:$KEY_STORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$OUT" \
            "$APK"
          rm -f keystore.jks
          apksigner verify --print-certs "$OUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Source archive
        if: steps.sign.outputs.signed == 'true'
        run: |
          PREFIX="look4sat-${GITHUB_REF_NAME#v}/"
          git archive --format=zip -9 --prefix="$PREFIX" HEAD \
            -o "look4sat-${GITHUB_REF_NAME#v}-source.zip"

      - name: Checksums
        if: steps.sign.outputs.signed == 'true'
        run: sha256sum *.apk *.idsig *.zip > SHA256SUMS.txt || sha256sum *.apk *.zip > SHA256SUMS.txt

      - name: Publish
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ./*.apk ./*.zip SHA256SUMS.txt
